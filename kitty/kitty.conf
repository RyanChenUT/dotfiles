# theme
include bamboo.conf

# terminal opacity and blur
dynamic_background_opacity yes
background_opacity 0.8
background_blur 1

# advance 
term xterm-kitty

# terminal bell
enable_audio_bell no

# os specific tweaks (Gnome window decoration for wayland)
linux_display_server x11

# font
font_family        DaddyTimeMono Nerd Font        
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size 10.0

# background image
background_image ~/dsktp_imgs/scifi_city.png
background_image_layout scaled
background_tint 0.95
background_tint_gaps 0.65

# font size management 
map ctrl+shift+backspace change_font_size all 0

# cursor customization
# block / beam / underline
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
shell_integration no-cursor

# scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0

# mouse
mouse_hide_wait -1

# window layout
remember_window_size  yes
initial_window_width  1200
initial_window_height 750
window_border_width 1.5pt
enabled_layouts splits, stack, tall
window_padding_width 0
window_margin_width 1
hide_window_decorations no

# keyboard protocol
map enter send_text kitty \r
map backspace send_text kitty \x7f


# window management 
map ctrl+shift+enter launch --location=split
map ctrl+right next_window
map ctrl+left previous_window
map ctrl+| launch --cwd=current --location=vsplit
map ctrl+- launch --cwd=current --location=hsplit 

# layout management
map ctrl+shift+l next_layout
map ctrl+shift+z toggle_layout stack

# tab bar customization
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_align left
active_tab_font_style   bold
inactive_tab_font_style normal

# tab management
map ctrl+t new_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+q close_tab

allow_remote_control yes

